<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 16px; }
        main { max-width: 650px; margin: auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 18px #00000012; }
        h1 { color: #183153; }
        form { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccd3dc; border-radius: 6px; }
        button { padding: 12px 18px; border: 0; border-radius: 6px; background: #1769aa; color: white; cursor: pointer; }
        li { padding: 10px 0; border-bottom: 1px solid #eee; }
        .hint { color: #667085; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <h1>DevOps Task Tracker</h1>
    <p class="hint">Add and track your project tasks.</p>
    <form method="POST">
        <input type="text" name="task" placeholder="Enter a task" aria-label="Task">
        <button type="submit">Add Task</button>
    </form>
    <h2>Tasks</h2>
    {% if tasks %}
        <ul>{% for task in tasks %}<li>{{ task }}</li>{% endfor %}</ul>
    {% else %}
        <p class="hint">No tasks yet. Add your first task above.</p>
    {% endif %}
</main>
</body>
</html>

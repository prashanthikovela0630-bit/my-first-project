<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Task Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fb; margin: 0; color: #1f2937; }
    main { max-width: 680px; margin: 60px auto; padding: 28px; background: white; border-radius: 14px; box-shadow: 0 8px 28px #17255418; }
    h1 { margin-top: 0; color: #174ea6; }
    p { color: #526174; }
    form { display: flex; gap: 10px; margin: 24px 0; }
    input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #174ea6; color: white; cursor: pointer; }
    li { padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    .tag { display: inline-block; background: #e8f0fe; color: #174ea6; padding: 5px 9px; border-radius: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Dockerized Flask Application</span>
    <h1>DevOps Task Tracker</h1>
    <p>Add a task, run the application inside a Docker container, and check its health endpoint.</p>
    <form method="post">
      <input name="title" placeholder="Enter a task title" required>
      <button type="submit">Add Task</button>
    </form>
    <h2>Tasks</h2>
    {% if tasks %}
      <ol>{% for task in tasks %}<li>{{ task }}</li>{% endfor %}</ol>
    {% else %}
      <p>No tasks yet. Add your first task above.</p>
    {% endif %}
  </main>
</body>
</html>
